name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::KEYSTORE_BASE64 secret is missing - refusing to publish a release signed with a throwaway key"
            exit 1
          else
            echo "::warning::No signing secrets found - using a throwaway debug key (this APK cannot be installed over other builds)"
          fi

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ github.run_number }} --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk FigmaWrapper-${{ steps.ver.outputs.name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: figma-wrapper-apk
          path: FigmaWrapper-*.apk

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FigmaWrapper-*.apk
